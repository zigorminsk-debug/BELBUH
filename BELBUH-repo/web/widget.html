<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BELHUB — виджет</title><style>:root{--g:#116443;--bg:#f1f5f4;--line:#d7e2de}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px "Segoe UI",Arial;color:#142437}header{background:linear-gradient(135deg,#103c31,#167652);color:#fff;padding:17px 18px 14px}h1{font-size:18px;margin:0 0 3px}header p{font-size:11px;margin:0;color:#d6eee5}.grid{padding:13px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{min-height:82px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px;text-align:left;cursor:pointer;color:#17283a;box-shadow:0 2px 7px #173b2d0c}.tile:hover{border-color:#79b39b;transform:translateY(-1px)}.icon{font-weight:800;color:var(--g);font-size:20px;display:block;margin-bottom:7px}.tile b{display:block;font-size:12px}.wide{grid-column:1/-1;min-height:48px;text-align:center;background:var(--g);color:#fff;border-color:var(--g)}footer{text-align:center;color:#718078;font-size:10px;padding:3px 12px 12px}</style></head><body><header><h1>BELHUB 3.2</h1><p>ООО «Компьютерная безопасность»</p></header><main class="grid"><button class="tile" data-url="http://portal.nalog.gov.by/"><span class="icon">₽</span><b>Личный кабинет МНС</b></button><button class="tile" data-avtun="https://portal2.ssf.gov.by/mainPage/?step=payer"><span class="icon">Ф</span><b>Портал ФСЗН</b></button><button class="tile" data-url="http://vat.gov.by/"><span class="icon">V</span><b>ЭСЧФ VAT</b></button><button class="tile" data-avtun="https://rvd.nbrb.by/nbrbResidentUi/#/"><span class="icon">₿</span><b>Валютные договоры</b></button><button class="tile" data-url="http://e-respondent.belstat.gov.by/belstat/"><span class="icon">Σ</span><b>Белстат</b></button><button class="tile" data-url="https://app.edn.by/web-new/login"><span class="icon">Э</span><b>ЭДиН</b></button><button class="tile" data-url="https://e-pasluga.by/"><span class="icon">Е</span><b>Е-Паслуга</b></button><button class="tile" data-url="https://goszakupki.by/"><span class="icon">З</span><b>Госзакупки</b></button><button class="tile wide" id="main">Открыть полный каталог</button></main><footer>Мы всегда рядом — Ваш комфорт, наша забота</footer><script>function name(u){let h=2166136261;for(const c of u){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return'belhub_'+(h>>>0).toString(16)}function openAvTun(u){location.href='belhub://avtun?target='+encodeURIComponent(u)}document.onclick=e=>{const a=e.target.closest('[data-avtun]');if(a){openAvTun(a.dataset.avtun);return}const b=e.target.closest('[data-url]');if(b){const w=open(b.dataset.url,name(b.dataset.url));if(w)w.focus()}};document.querySelector('#main').onclick=()=>location.href='BELHUB-3.2.html';</script></body></html>
